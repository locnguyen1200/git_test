<body> 
  <div class = "box">
    <div class="box-text">
      <h1 class="title_size">Loc's Portfolio</h1>
      <p> this will be my photography page</p>
      <p> webpage still being built</p>
    </div>

    <div class="camera-alignment">
      <div class="viewport">
    <div class="rig">
      <div class="camera">
        <!-- Front Plate & Lens -->
        <div class="face front">
          <div class="viewfinder"></div>
          <div class="rangefinder"></div>
          <div class="lens-barrel"></div>
        </div>

        <!-- Back Plate -->
        <div class="face back">
          <div class="film-door"></div>
        </div>

        <!-- Sides -->
        <div class="face left"></div>
        <div class="face right"></div>

        <!-- Top Plate with Controls -->
        <div class="face top">
          <div class="shutter-btn"></div>

        <!-- Bottom Plate -->
        <div class="face bottom"></div>

      </div>
    </div>
  </div>
 </div>
