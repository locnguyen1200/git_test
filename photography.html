    .globe-portal-scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 130px;
    }

    /* Globe Dossier Banner */
    .globe-dossier-banner {
      display: flex;
      align-items: center;
      margin-top: 32px;
      padding: 12px 24px;
      border: 2px dashed var(--theme-box-border);
      background: transparent;
      text-decoration: none;
      color: var(--theme-text);
      gap: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .globe-dossier-banner:hover {
      background: var(--theme-box-border);
      color: var(--theme-box-bg);
    }
    .globe-dossier-canvas-wrap {
      width: 80px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .globe-dossier-canvas-wrap canvas {
      width: 80px;
      height: 80px;
      transition: transform 0.4s ease;
    }
    .globe-dossier-banner:hover .globe-dossier-canvas-wrap canvas {
      transform: scale(1.1);
    }
    .globe-dossier-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .globe-dossier-title {
      font-family: var(--theme-font);
      font-weight: bold;
      font-size: 1.1em;
      letter-spacing: 0.1em;
    }
    .globe-dossier-desc {
      font-size: 0.85em;
      opacity: 0.8;
      font-style: italic;
    }
    .globe-dossier-arrow {
      width: 24px;
      height: 24px;
      opacity: 0.5;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .globe-dossier-banner:hover .globe-dossier-arrow {
      opacity: 1;
      transform: translateX(4px);
    }
    html[data-theme="matrix"] .globe-dossier-banner:hover {
      color: #000000;
    }
    html[data-theme="midnight"] .globe-dossier-banner:hover {
      color: #000000;
    }
    html[data-theme="twa"] .globe-dossier-banner:hover {
      background: #e0212a;
      color: #ffffff;
      border-color: #e0212a;
    }
</style>

  <script>
    (function () {
      const canvas = document.getElementById('globe-portal-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2;
      const R = W * 0.38;

      const globeBtn = document.querySelector('.globe-dossier-banner');
      let isHovered = false;

      globeBtn.addEventListener('mouseenter', () => { isHovered = true; });
      globeBtn.addEventListener('mouseleave', () => { isHovered = false; });

      function cssVar(name, fallback) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
      }

      let yaw = 0;

      function draw() {
        ctx.clearRect(0, 0, W, H);

        const isMatrix = document.documentElement.getAttribute('data-theme') === 'matrix';
        const isMidnight = document.documentElement.getAttribute('data-theme') === 'midnight';
        const isTWA = document.documentElement.getAttribute('data-theme') === 'twa';
        
        let primary = isMatrix ? '#00ff41' : (isMidnight ? '#ece6d8' : (isTWA ? '#e0212a' : cssVar('--theme-accent', '#245782')));
        let secondary = isMatrix ? '#00ff41' : (isMidnight ? '#ffffff' : (isTWA ? '#eb2130' : cssVar('--theme-accent-light', '#7d9ab3')));
        
        // Invert colors on hover since the banner background inverts!
        if (isHovered) {
          primary = isMatrix ? '#000000' : (isMidnight ? '#000000' : (isTWA ? '#ffffff' : primary));
          secondary = isMatrix ? '#003300' : (isMidnight ? '#333333' : (isTWA ? '#ffb3ba' : secondary));
        }
        
        const accent = primary;
        const accentLight = secondary;
        const speed       = isHovered ? 0.030 : 0.005;
        const lineAlpha   = isHovered ? 0.90  : 0.70;  /* more visible at rest */
        const lineW       = isHovered ? 1.6   : 1.1;


        const grad = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.25, R * 0.04, cx, cy, R);
        grad.addColorStop(0, accentLight + (isHovered ? 'aa' : '88'));
        grad.addColorStop(1, accent + (isHovered ? '30' : '22'));
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.clip();

        ctx.strokeStyle = accent;
        ctx.lineWidth = lineW;

        for (let i = 1; i < 8; i++) {
          const phi = (i / 8) * Math.PI;
          const y0  = cy + R * Math.cos(phi);
          const rx  = R * Math.sin(phi);
          ctx.globalAlpha = lineAlpha * Math.sin(phi);
          ctx.beginPath();
          ctx.ellipse(cx, y0, rx, rx * 0.26, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (let i = 0; i < 9; i++) {
          const theta = yaw + (i / 9) * Math.PI * 2;
          const cosT  = Math.cos(theta);
          ctx.globalAlpha = lineAlpha * (0.4 + 0.6 * Math.abs(cosT));
          ctx.beginPath();
          ctx.ellipse(cx, cy, Math.abs(cosT) * R, R, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.globalAlpha = isHovered ? 1.0 : 0.5;
        ctx.lineWidth   = isHovered ? 2.0 : 1.0;
        ctx.strokeStyle = accentLight;
        ctx.beginPath();
        ctx.ellipse(cx, cy, R, R * 0.26, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();

        ctx.globalAlpha = isHovered ? 0.85 : 0.28;
        ctx.strokeStyle = accent;
        ctx.lineWidth   = isHovered ? 2.0  : 1.0;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = 1;
        yaw += speed;
        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
