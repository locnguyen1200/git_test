<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata and shared stylesheet -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography | Loc's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared sidebar navigation -->
  <nav class="sidebar" aria-label="Main navigation">
    <a class="sidebar-link" href="index.html" aria-label="Home" title="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9 20v-6h6v6" />
      </svg>
    </a>
    <a class="sidebar-link is-active" href="photography.html" aria-label="Photography" title="Photography">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="1" />
        <circle cx="16" cy="8" r="1.5" />
        <path d="m5.5 18 4.5-5 3 3 2-2 3.5 4" />
      </svg>
    </a>
    <a class="sidebar-link" href="camera.html" aria-label="Camera" title="Camera">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8h3l1.5-2h7L17 8h3v11H4Z" />
        <circle cx="12" cy="13" r="3.5" />
        <path d="M6.5 11h.01" />
      </svg>
    </a>
  </nav>

  <!-- Photography page content -->
  <main class="box page-content">
    <header class="page-heading">
      <p class="eyebrow">collections throughout the years</p>
      <h1 class="title_size">photography</h1>
      <p> a compilation of my photographic work over the years.</p>
    </header>

    <!-- Each frame opens its own gallery page -->
    <section class="photo-grid" aria-label="Photography collection">
      <a class="photo-frame gallery-link" href="black-and-white.html" aria-label="Open the black and white gallery">
        <img class="photo-placeholder photo-thumbnail" src="bw_photos/bw_photos_image_003.jpg" alt="Preview of the black and white gallery">
        <div class="photo-caption">B&amp;W</div>
      </a>
      <a class="photo-frame gallery-link" href="colour.html" aria-label="Open the colour gallery">
         <img class="photo-placeholder photo-thumbnail" src="colour_photos/colour_photos_image_006.jpg" alt="Preview of the colour gallery">
        <div class="photo-caption">COLOUR</div>
      </a>
      <a class="photo-frame gallery-link" href="places.html" aria-label="Open the places gallery">
        <img class="photo-placeholder photo-thumbnail" src="places_photos/places_photos_image_001.jpg" alt="Preview of the places gallery">
        <div class="photo-caption">PLACES</div>
      </a>
      <a class="photo-frame gallery-link" href="portraits.html" aria-label="Open the portraits gallery">
        <img class="photo-placeholder photo-thumbnail" src="portrait_photos/portrait_photos_image_001.jpg" alt="Preview of the portraits gallery">
        <div class="photo-caption">PORTRAITS</div>
      </a>
    </section>
  </main>

  <!-- Footer: FAQ and contact links -->
  <footer class="site-footer" aria-label="Additional links">
    <a class="footer-link" href="faq.html" aria-label="Frequently asked questions" title="FAQ">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.6 9a2.5 2.5 0 1 1 3.8 2.2c-.9.5-1.4 1-1.4 2" />
        <path d="M12 16.5h.01" />
      </svg>
    </a>
    <a class="footer-link" href="mailto:your-email@example.com" aria-label="Contact me by email" title="Contact me">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="1" />
        <path d="m4 7 8 6 8-6" />
      </svg>
    </a>
  </footer>

</body>
</html>
