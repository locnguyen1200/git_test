<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata and shared stylesheet -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black &amp; White | Loc's Portfolio</title>
  <link id="site-favicon" rel="icon" type="image/svg+xml">
  <script src="site-icon.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=EB+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;600;700&family=Share+Tech+Mono&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="photo-collection-page">
  <script src="page-transition.js"></script>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('site-theme') || 'default');</script>
  <script src="matrix-rain.js"></script>
  <script src="midnight-camera.js"></script>
  <!-- Return to the photography collection overview -->
  <a class="back-button" href="photography.html" aria-label="Back to photography" title="Back to photography">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7M8 12h12" /></svg>
    <span>Back</span>
  </a>

  <!-- Shared sidebar navigation -->
  <nav class="sidebar" aria-label="Main navigation">
    <a class="sidebar-link" href="index.html" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9 20v-6h6v6" /></svg></a>
    <a class="sidebar-link is-active" href="photography.html" aria-label="Photography" title="Photography"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1" /><circle cx="16" cy="8" r="1.5" /><path d="m5.5 18 4.5-5 3 3 2-2 3.5 4" /></svg></a>
    <a class="sidebar-link" href="camera.html" aria-label="Camera" title="Camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4Z" /><circle cx="12" cy="13" r="3.5" /><path d="M6.5 11h.01" /></svg></a>
  </nav>

  <!-- Black and white photo gallery -->
  <main class="bw-gallery" aria-label="Black and white photographs">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_001.jpg" alt="Black and white photograph 1" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_002.jpg" alt="Black and white photograph 2" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_003.jpg" alt="Black and white photograph 3" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_004.jpg" alt="Black and white photograph 4" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_005.jpg" alt="Black and white photograph 5" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_006.jpg" alt="Black and white photograph 6" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_007.jpg" alt="Black and white photograph 7" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_008.jpg" alt="Black and white photograph 8" loading="lazy" decoding="async">
      <img class="gallery-trigger" src="bw_photos/bw_photos_image_009.jpg" alt="Black and white photograph 9" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_010.jpg" alt="Black and white photograph 10" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_011.jpg" alt="Black and white photograph 11" loading="lazy" decoding="async">
    <img class="gallery-trigger" src="bw_photos/bw_photos_image_012.jpg" alt="Black and white photograph 12" loading="lazy" decoding="async">
      <img class="gallery-trigger" src="bw_photos/bw_photos_image_013.jpg" alt="Black and white photograph 13" data-location="Bang Kok" loading="lazy" decoding="async">
      <img class="gallery-trigger" src="bw_photos/bw_photos_image_014.jpg" alt="Black and white photograph 14" data-location="Bangkok" loading="lazy" decoding="async">
  </main>

  <!-- Clicked image carousel -->
  <div class="gallery-modal" id="gallery-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden>
    <div class="gallery-window">
      <button class="gallery-close" type="button" aria-label="Close gallery" title="Close gallery">&times;</button>
      <p class="eyebrow" id="gallery-title">Black &amp; White</p>
      <img class="gallery-image" id="gallery-image" alt="Expanded black and white photograph">
      <p class="gallery-count" id="gallery-count">1/8</p>
      <div class="gallery-controls">
        <button class="gallery-arrow" id="gallery-previous" type="button" aria-label="Previous picture" title="Previous picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg></button>
        <button class="gallery-arrow" id="gallery-next" type="button" aria-label="Next picture" title="Next picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg></button>
      </div>
    </div>
  </div>

  <script src="gallery.js"></script>

</body>
</html>
