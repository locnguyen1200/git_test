<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata and external styles -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loc's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=EB+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260902-2">
</head>

<body>
  <script src="page-transition.js"></script>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('site-theme') || 'default');</script>
  <script src="matrix-rain.js"></script>
  <script src="midnight-camera.js"></script>
  <!-- Sidebar: three navigation links with icon-only controls -->
  <nav class="sidebar" aria-label="Main navigation">
    <!-- Home link: the is-active class gives this icon its selected style -->
    <a class="sidebar-link is-active" href="index.html" aria-label="Home" title="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9 20v-6h6v6" />
      </svg>
    </a>

    <!-- Photography link: jumps to the portfolio content section -->
    <a class="sidebar-link" href="photography.html" aria-label="Photography" title="Photography">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="1" />
        <circle cx="16" cy="8" r="1.5" />
        <path d="m5.5 18 4.5-5 3 3 2-2 3.5 4" />
      </svg>
    </a>

    <!-- Camera link: jumps to the 3D camera section -->
    <a class="sidebar-link" href="camera.html" aria-label="Camera" title="Camera">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8h3l1.5-2h7L17 8h3v11H4Z" />
        <circle cx="12" cy="13" r="3.5" />
        <path d="M6.5 11h.01" />
      </svg>
    </a>
  </nav>

  <!-- Portfolio section: contains the introduction and camera display -->
  <main class="box" id="photography">
    <!-- Introduction text -->
    <section class="box-text" aria-labelledby="portfolio-title">
      <h1 class="title_size" id="portfolio-title">Loc's Portfolio</h1>
      <p>this will be my photography page.</p>
      <p>webpage is still being built.</p>

      <!-- Theme switcher: a custom retro dropdown (native <select> menus can't be restyled) -->
      <div class="theme-switcher">
        <div class="retro-dropdown" id="theme-dropdown">
          <button type="button" class="retro-dropdown-trigger" id="theme-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="theme-dropdown-value">Retro Blue</span>
          </button>
          <ul class="retro-dropdown-list" id="theme-dropdown-list" role="listbox" tabindex="-1" hidden>
            <li role="option" data-theme-value="default" data-theme-label="Retro Blue">Retro Blue</li>
            <li role="option" data-theme-value="blackwhite" data-theme-label="Black &amp; White">Black &amp; White</li>
            <li role="option" data-theme-value="midnight" data-theme-label="Midnight">Midnight</li>
            <li role="option" data-theme-value="sepia" data-theme-label="Sepia Terminal">Sepia Terminal</li>
            <li role="option" data-theme-value="matrix" data-theme-label="Matrix">Matrix</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Camera section: alignment wrapper, perspective stage, and 3D model -->
    <section class="camera-alignment" id="camera" aria-label="3D camera">
      <div class="viewport">
        <div class="rig">
          <div class="camera">
            <!-- Camera front plate: viewfinder, rangefinder, and lens -->
            <div class="face front">
              <div class="viewfinder"></div>
              <div class="rangefinder"></div>

              <!-- Lens assembly: barrel, front glass, and removable cap -->
              <div class="lens-barrel">
                <div class="lens-cylinder">
                  <!-- Twelve facets form the rounded barrel body -->
                  <span style="--i:0;"></span>
                  <span style="--i:1;"></span>
                  <span style="--i:2;"></span>
                  <span style="--i:3;"></span>
                  <span style="--i:4;"></span>
                  <span style="--i:5;"></span>
                  <span style="--i:6;"></span>
                  <span style="--i:7;"></span>
                  <span style="--i:8;"></span>
                  <span style="--i:9;"></span>
                  <span style="--i:10;"></span>
                  <span style="--i:11;"></span>
                </div>
                <div class="lens-front">
                  <div class="lens-element"></div>
                </div>
                <div class="lens-cap"></div>
              </div>
            </div>

            <!-- Camera back plate and film door -->
            <div class="face back">
              <div class="film-door"></div>
            </div>

            <!-- Camera left and right side plates -->
            <div class="face left"></div>
            <div class="face right"></div>

            <!-- Camera top plate and shutter button -->
            <div class="face top">
              <div class="shutter-btn"></div>
            </div>

            <!-- Camera bottom plate -->
            <div class="face bottom"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <section class="collection-notice-dropzone" id="collection-dropzone" aria-hidden="true">
    <div class="dropzone-hint">Drop here to reset</div>
  </section>

  <!-- Hidden easter egg: family photos behind the system alert -->
  <div class="family-photo-easter-egg" id="family-photos-container" aria-label="Family photos easter egg">
  </div>

  <section class="collection-notices" aria-label="New collection notifications">
    <div class="notices-header">
      <span>SYSTEM ALERT // COLLECTION ARCHIVE <span class="notice-alert" aria-hidden="true">!</span></span>
      <button class="notice-unread" id="notice-unread" type="button">MARK ALL READ</button>
    </div>
    <div class="notice-scroll-wrapper">
      <div id="collection-notice-list"></div>
      <div class="notice-scrollbar" id="notice-scrollbar" aria-hidden="true">
        <div class="notice-scrollbar-thumb" id="notice-scrollbar-thumb"></div>
      </div>
    </div>
    <button class="notice-log" id="notice-log" type="button">LOG // VIEW ARCHIVE</button>
  </section>

  <div class="alert-log-modal" id="alert-log-modal" role="dialog" aria-modal="true" aria-labelledby="alert-log-title" hidden>
    <section class="alert-log-window">
      <div class="alert-log-header">
        <span id="alert-log-title">SYSTEM LOG // ALERT HISTORY</span>
        <button class="alert-log-close" id="alert-log-close" type="button" aria-label="Close alert history" title="Close">&times;</button>
      </div>
      <div class="alert-log-list" id="alert-log-list"></div>
    </section>
  </div>

  <!-- Clicked family photo carousel -->
  <div class="gallery-modal" id="gallery-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-title" hidden>
    <div class="gallery-window">
      <button class="gallery-close" type="button" aria-label="Close gallery" title="Close gallery">&times;</button>
      <p class="eyebrow" id="gallery-title">Family</p>
      <img class="gallery-image" id="gallery-image" alt="Expanded family photograph">
      <p class="gallery-count" id="gallery-count">1/1</p>
      <div class="gallery-controls">
        <button class="gallery-arrow" id="gallery-previous" type="button" aria-label="Previous picture" title="Previous picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg></button>
        <button class="gallery-arrow" id="gallery-next" type="button" aria-label="Next picture" title="Next picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg></button>
      </div>
    </div>
  </div>

  <!-- Footer: FAQ and contact links -->
  <footer class="site-footer" aria-label="Additional links">
    <a class="footer-link" href="faq.html" aria-label="Frequently asked questions" title="FAQ">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.6 9a2.5 2.5 0 1 1 3.8 2.2c-.9.5-1.4 1-1.4 2" />
        <path d="M12 16.5h.01" />
      </svg>
    </a>
    <a class="footer-link" href="mailto:minhlocnguyen1200@example.com" aria-label="Contact me by email" title="Contact me">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="1" />
        <path d="m4 7 8 6 8-6" />
      </svg>
    </a>
  </footer>

  <!-- Generated collection data and interaction scripts -->
  <script src="collection-data.js"></script>
  <script>
    const camera = document.querySelector('.camera');
    let targetYaw = 0;
    let targetPitch = 0;
    let currentYaw = 0;
    let currentPitch = 0;
    const easeSpeed = 0.08; // Lower = smoother, more organic

    document.addEventListener('pointermove', (event) => {
      const cameraBounds = camera.getBoundingClientRect();
      const cameraCenterX = cameraBounds.left + cameraBounds.width / 2;
      const cameraCenterY = cameraBounds.top + cameraBounds.height / 2;
      const horizontal = (event.clientX - cameraCenterX) / (window.innerWidth / 2);
      const vertical = (event.clientY - cameraCenterY) / (window.innerHeight / 2);
      targetYaw = horizontal * 39.6;
      targetPitch = vertical * -36;
    });

    // Smooth animation loop
    function animateCamera() {
      // Easing interpolation for smooth, organic movement
      currentYaw += (targetYaw - currentYaw) * easeSpeed;
      currentPitch += (targetPitch - currentPitch) * easeSpeed;

      camera.style.transform = `rotateX(${currentPitch}deg) rotateY(${currentYaw}deg)`;
      requestAnimationFrame(animateCamera);
    }
    animateCamera();

    // Return the camera to its default angle when the pointer leaves the page.
    document.addEventListener('mouseleave', () => {
      targetYaw = 0;
      targetPitch = 0;
    });

    // Collection notices are generated from update-collections.js data.
    const notices = document.querySelector('#collection-notice-list');
    const collections = window.collectionData.collections || [];
    const alertHistory = window.collectionData.alertHistory || [];
    const noticeReadStateKey = 'collection-notice-read-state';
    const savedReadNotices = new Set(JSON.parse(localStorage.getItem(noticeReadStateKey) || '[]'));

    collections.forEach((collection) => {
      const notice = document.createElement('article');
      notice.className = 'collection-notice';
      notice.classList.toggle('is-read', savedReadNotices.has(collection.id));
      notice.dataset.alertId = collection.id;
      notice.setAttribute('role', 'alert');
      notice.innerHTML = `
        <div class="notice-bar">
          <span>SYSTEM NOTICE // NEW COLLECTION</span>
          <button class="notice-close" type="button" aria-label="Close ${collection.name} notice" title="Close">×</button>
        </div>
        <div class="notice-content">
          <p>New photographs have been uploaded.</p>
          <dl class="notice-details">
            <div><dt>Collection</dt><dd>${collection.name}</dd></div>
            <div><dt>Photos added</dt><dd>${collection.photosAdded}</dd></div>
            <div><dt>Date added</dt><dd>${collection.dateAdded}</dd></div>
          </dl>
          <a class="notice-link" href="${collection.link}">Open collection &gt;&gt;</a>
        </div>`;
      notice.querySelector('.notice-close').addEventListener('click', () => {
        notice.classList.add('is-read');
        updateNoticeState();
        saveNoticeState();
      });
      notices.append(notice);
    });

    const noticeUnread = document.querySelector('#notice-unread');
    const noticeAlert = document.querySelector('.notice-alert');

    function updateNoticeState() {
      const allRead = [...notices.children].every((notice) => notice.classList.contains('is-read'));
      notices.closest('.collection-notices').classList.toggle('all-read', allRead);
      noticeUnread.textContent = allRead ? 'MARK ALL UNREAD' : 'MARK ALL READ';
    }

    function saveNoticeState() {
      const readAlertIds = [...notices.children]
        .filter((notice) => notice.classList.contains('is-read'))
        .map((notice) => notice.dataset.alertId);
      localStorage.setItem(noticeReadStateKey, JSON.stringify(readAlertIds));
    }

    noticeUnread.addEventListener('click', () => {
      const allRead = [...notices.children].every((notice) => notice.classList.contains('is-read'));
      notices.querySelectorAll('.collection-notice').forEach((notice) => {
        notice.classList.toggle('is-read', !allRead);
      });
      updateNoticeState();
      saveNoticeState();
    });

    updateNoticeState();

    const alertLogButton = document.getElementById('notice-log');
    const alertLogModal = document.getElementById('alert-log-modal');
    const alertLogClose = document.getElementById('alert-log-close');
    const alertLogList = document.getElementById('alert-log-list');

    alertHistory.forEach((alert) => {
      const entry = document.createElement('article');
      entry.className = 'alert-log-entry';
      entry.innerHTML = `
        <dl>
          <div><dt>Collection</dt><dd>${alert.name}</dd></div>
          <div><dt>New photos</dt><dd>${alert.photosAdded}</dd></div>
          <div><dt>Added</dt><dd>${alert.dateAdded}</dd></div>
          <div><dt>Expired</dt><dd>${alert.expiresOn}</dd></div>
        </dl>`;
      alertLogList.append(entry);
    });

    if (alertHistory.length === 0) {
      alertLogList.innerHTML = '<p class="alert-log-empty">No new-photo alerts recorded.</p>';
    }

    function closeAlertLog() {
      alertLogModal.hidden = true;
      document.body.classList.remove('alert-log-open');
      alertLogButton.focus();
    }

    alertLogButton.addEventListener('click', () => {
      alertLogModal.hidden = false;
      document.body.classList.add('alert-log-open');
      alertLogClose.focus();
    });

    alertLogClose.addEventListener('click', closeAlertLog);
    alertLogModal.addEventListener('click', (event) => {
      if (event.target === alertLogModal) closeAlertLog();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !alertLogModal.hidden) closeAlertLog();
    });

    // Custom retro scrollbar for the notice list (replaces the native scrollbar)
    const noticeScrollbar = document.getElementById('notice-scrollbar');
    const noticeScrollbarThumb = document.getElementById('notice-scrollbar-thumb');

    function updateNoticeScrollbar() {
      const trackHeight = noticeScrollbar.clientHeight;
      const contentHeight = notices.scrollHeight;
      const visibleHeight = notices.clientHeight;

      if (contentHeight <= visibleHeight) {
        noticeScrollbar.hidden = true;
        return;
      }
      noticeScrollbar.hidden = false;

      const thumbHeight = Math.max((visibleHeight / contentHeight) * trackHeight, 20);
      const maxThumbTop = trackHeight - thumbHeight;
      const scrollRatio = notices.scrollTop / (contentHeight - visibleHeight);
      noticeScrollbarThumb.style.height = `${thumbHeight}px`;
      noticeScrollbarThumb.style.top = `${scrollRatio * maxThumbTop}px`;
    }

    notices.addEventListener('scroll', updateNoticeScrollbar);
    window.addEventListener('resize', updateNoticeScrollbar);
    new MutationObserver(updateNoticeScrollbar).observe(notices, { childList: true, subtree: true });
    updateNoticeScrollbar();

    let isDraggingNoticeThumb = false;
    let noticeDragStartY = 0;
    let noticeDragStartScrollTop = 0;

    noticeScrollbarThumb.addEventListener('pointerdown', (event) => {
      isDraggingNoticeThumb = true;
      noticeDragStartY = event.clientY;
      noticeDragStartScrollTop = notices.scrollTop;
      noticeScrollbarThumb.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    noticeScrollbarThumb.addEventListener('pointermove', (event) => {
      if (!isDraggingNoticeThumb) return;
      const trackHeight = noticeScrollbar.clientHeight;
      const contentHeight = notices.scrollHeight;
      const visibleHeight = notices.clientHeight;
      const thumbHeight = noticeScrollbarThumb.offsetHeight;
      const maxThumbTop = trackHeight - thumbHeight;
      if (maxThumbTop <= 0) return;
      const deltaY = event.clientY - noticeDragStartY;
      const scrollableDistance = contentHeight - visibleHeight;
      notices.scrollTop = noticeDragStartScrollTop + (deltaY / maxThumbTop) * scrollableDistance;
    });

    function endNoticeThumbDrag() {
      isDraggingNoticeThumb = false;
    }
    noticeScrollbarThumb.addEventListener('pointerup', endNoticeThumbDrag);
    noticeScrollbarThumb.addEventListener('pointercancel', endNoticeThumbDrag);

    noticeScrollbar.addEventListener('pointerdown', (event) => {
      if (event.target === noticeScrollbarThumb) return;
      const trackRect = noticeScrollbar.getBoundingClientRect();
      const trackHeight = noticeScrollbar.clientHeight;
      const contentHeight = notices.scrollHeight;
      const visibleHeight = notices.clientHeight;
      const thumbHeight = noticeScrollbarThumb.offsetHeight;
      const maxThumbTop = trackHeight - thumbHeight;
      if (maxThumbTop <= 0) return;
      const clickY = event.clientY - trackRect.top - thumbHeight / 2;
      const clampedTop = Math.max(0, Math.min(clickY, maxThumbTop));
      notices.scrollTop = (clampedTop / maxThumbTop) * (contentHeight - visibleHeight);
    });

    // Easter egg: Populate family photos behind the system alert
    const familyPhotosContainer = document.getElementById('family-photos-container');
    familyPhotosContainer.hidden = collections.length === 0;

    // Always generate family photos (up to 12), they'll be hidden if they don't exist
    const familyPhotoCount = 12;
    for (let i = 0; i < familyPhotoCount; i++) {
      const img = document.createElement('img');
      img.src = `family_photos/family_photos_image_${String(i + 1).padStart(3, '0')}.jpg`;
      img.alt = `Family photo ${i + 1}`;
      img.className = 'gallery-trigger';
      img.style.visibility = 'hidden'; // Stay hidden until loaded, to avoid a broken-image flash
      img.onload = function() { this.style.visibility = 'visible'; };
      img.onerror = function() { this.style.display = 'none'; }; // Hide broken images

      // Lay photos out in a fanned grid so they clearly separate instead of stacking
      const columns = 4;
      const column = i % columns;
      const row = Math.floor(i / columns);
      const rotation = (i % 2 === 0 ? -1 : 1) * (6 + (i % 4) * 5);
      const photoOffsetX = (column - (columns - 1) / 2) * 100;
      const photoOffsetY = row * 60;
      img.style.transform = `translateX(${photoOffsetX}px) rotate(${rotation}deg)`;
      img.style.top = `${20 + photoOffsetY}px`;
      img.style.zIndex = String(familyPhotoCount - i);
      familyPhotosContainer.appendChild(img);
    }

    // Make collection notices draggable
    const collectionNotices = document.querySelector('.collection-notices');
    const noticesHeader = document.querySelector('.notices-header');
    const collectionDropzone = document.getElementById('collection-dropzone');
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;
    let originalWidth = null;

    // Reset position on page load
    function resetNotices() {
      collectionNotices.classList.remove('is-dragging');
      familyPhotosContainer.classList.remove('is-revealed');
      collectionNotices.style.position = 'relative';
      collectionNotices.style.left = 'auto';
      collectionNotices.style.top = 'auto';
      collectionNotices.style.margin = '24px auto 40px';
      collectionNotices.style.width = '';
      collectionNotices.dataset.isDraggable = 'false';
      collectionDropzone.style.display = 'none';
    }

    resetNotices();

    // Pointer capture keeps drag tracking reliable even at high speed or outside the window
    noticesHeader.addEventListener('pointerdown', (event) => {
      if (event.target.closest('button, a, input, select, textarea')) return;

      isDragging = true;
      noticesHeader.setPointerCapture(event.pointerId);
      const rect = collectionNotices.getBoundingClientRect();

      // Switch to fixed positioning permanently once picked up
      if (collectionNotices.dataset.isDraggable !== 'true') {
        originalWidth = rect.width;
        collectionNotices.classList.add('is-dragging');
        collectionNotices.style.position = 'fixed';
        collectionNotices.style.margin = '0';
        collectionNotices.style.width = originalWidth + 'px';
        collectionNotices.dataset.isDraggable = 'true';
        collectionDropzone.style.display = 'block';
        familyPhotosContainer.classList.add('is-revealed');
      }

      // Set left/top immediately so the box doesn't jump before the first pointermove
      collectionNotices.style.left = rect.left + 'px';
      collectionNotices.style.top = rect.top + 'px';

      // Calculate offset from pointer to element's top-left
      offsetX = event.clientX - rect.left;
      offsetY = event.clientY - rect.top;
      event.preventDefault();
    });

    noticesHeader.addEventListener('pointermove', (event) => {
      if (!isDragging) return;
      collectionNotices.style.left = (event.clientX - offsetX) + 'px';
      collectionNotices.style.top = (event.clientY - offsetY) + 'px';
    });

    function endDrag(event) {
      if (!isDragging) return;
      isDragging = false;
      noticesHeader.releasePointerCapture(event.pointerId);

      const headerRect = noticesHeader.getBoundingClientRect();
      const dropzoneRect = collectionDropzone.getBoundingClientRect();
      const isOverlapping = !(headerRect.right < dropzoneRect.left ||
                             headerRect.left > dropzoneRect.right ||
                             headerRect.bottom < dropzoneRect.top ||
                             headerRect.top > dropzoneRect.bottom);

      if (isOverlapping) resetNotices();
    }

    noticesHeader.addEventListener('pointerup', endDrag);
    noticesHeader.addEventListener('pointercancel', endDrag);

    // Theme switcher: custom retro dropdown that applies a data-theme attribute
    const themeDropdown = document.getElementById('theme-dropdown');
    const themeTrigger = document.getElementById('theme-dropdown-trigger');
    const themeList = document.getElementById('theme-dropdown-list');
    const themeValueLabel = document.getElementById('theme-dropdown-value');
    const themeOptions = Array.from(themeList.querySelectorAll('li'));

    function applyTheme(themeValue) {
      const option = themeOptions.find((item) => item.dataset.themeValue === themeValue) || themeOptions[0];
      document.documentElement.setAttribute('data-theme', option.dataset.themeValue);
      themeValueLabel.textContent = option.dataset.themeLabel;
      themeOptions.forEach((item) => item.setAttribute('aria-selected', String(item === option)));
      localStorage.setItem('site-theme', option.dataset.themeValue);
    }

    function openThemeDropdown() {
      themeList.hidden = false;
      themeTrigger.setAttribute('aria-expanded', 'true');
    }

    function closeThemeDropdown() {
      themeList.hidden = true;
      themeTrigger.setAttribute('aria-expanded', 'false');
    }

    applyTheme(localStorage.getItem('site-theme') || 'default');

    themeTrigger.addEventListener('click', () => {
      if (themeList.hidden) {
        openThemeDropdown();
      } else {
        closeThemeDropdown();
      }
    });

    themeOptions.forEach((option) => {
      option.addEventListener('click', () => {
        applyTheme(option.dataset.themeValue);
        closeThemeDropdown();
        themeTrigger.focus();
      });
    });

    document.addEventListener('click', (event) => {
      if (!themeDropdown.contains(event.target)) closeThemeDropdown();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !themeList.hidden) {
        closeThemeDropdown();
        themeTrigger.focus();
      }
    });
  </script>

  <!-- Loaded after the family photos exist so it can find the .gallery-trigger elements -->
  <script src="gallery.js"></script>
</body>
</html>
